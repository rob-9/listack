# Server Configuration
server.port=5000
server.address=0.0.0.0

# Application Configuration
spring.application.name=LeInterview

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Gemini API Configuration
gemini.api-key=${GEMINI_API_KEY:demo}

# Interview Configuration
interview.demo-mode=${DEMO_MODE:true}
interview.audio-enabled=${AUDIO_ENABLED:false}
interview.use-kubernetes=${USE_KUBERNETES:false}

# Kubernetes Configuration
kubernetes.namespace=${KUBERNETES_NAMESPACE:interview-platform}

# Logging
logging.level.com.leinterview=INFO
logging.level.root=INFO

# Actuator Configuration
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
